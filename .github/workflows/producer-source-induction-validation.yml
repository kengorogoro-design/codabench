name: Executable producer source induction delivery
on:
  push:
    branches:
      - validation/producer-source-induction-2512
permissions:
  contents: read
jobs:
  repository-native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Re-execute frozen producer and verify exact product bytes
        run: python3 .genesis/source-induction/replay.py
      - name: Prepare Codabench CI environment
        run: |
          cp .env_circleci .env
          cp my-postgres_sample.conf my-postgres.conf
          mkdir -p var/minio/public var/minio/private
      - name: Start core Codabench services
        run: docker compose up -d db rabbit redis minio createbuckets django
      - name: Observe the unmodified upstream defect
        run: |
          python3 .genesis/source-induction/materialize.py baseline
          if docker compose exec -T -e CELERY_TASK_ALWAYS_EAGER=True django py.test -q --junitxml=src/producer-baseline.xml src/apps/api/tests/test_leaderboards.py::LeaderboardNullScoreOrderingTests::test_missing_primary_score_is_ranked_after_scored_submission src/apps/api/tests/test_leaderboards.py::LeaderboardNullScoreOrderingTests::test_force_best_ignores_submission_missing_primary_score; then
            echo "Baseline unexpectedly passed"
            exit 1
          fi
          python3 .genesis/source-induction/verify_baseline.py
          python3 .genesis/source-induction/materialize.py delivery
          python3 .genesis/source-induction/replay.py
      - name: Test generated repair in both directions and serializers
        run: docker compose exec -T -e CELERY_TASK_ALWAYS_EAGER=True django py.test -q src/apps/api/tests/test_leaderboards.py::LeaderboardNullScoreOrderingTests
      - name: Run repository lint
        run: docker compose exec -T django flake8 src/
      - name: Run repository unit and integration tests
        run: docker compose exec -T -e CELERY_TASK_ALWAYS_EAGER=True django py.test src/
      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=1000 django db rabbit redis minio
