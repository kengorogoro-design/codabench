name: Issue 2512 G0 producer court validation

on:
  push:
    branches:
      - validation/2512-ci

jobs:
  repository-native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Prepare Codabench CI environment
        run: |
          cp .env_circleci .env
          cp my-postgres_sample.conf my-postgres.conf
          mkdir -p var/minio/public var/minio/private
      - name: Start core Codabench services
        run: docker compose up -d db rabbit redis minio createbuckets django
      - name: Run focused ranking regressions
        run: |
          docker compose exec -T -e CELERY_TASK_ALWAYS_EAGER=True django \
            py.test -q \
            src/apps/api/tests/test_leaderboards.py::LeaderboardNullScoreOrderingTests::test_missing_primary_score_is_ranked_after_scored_submission \
            src/apps/api/tests/test_leaderboards.py::LeaderboardNullScoreOrderingTests::test_force_best_ignores_submission_missing_primary_score
      - name: Run repository lint
        run: docker compose exec -T django flake8 src/
      - name: Run repository unit and integration tests
        run: docker compose exec -T -e CELERY_TASK_ALWAYS_EAGER=True django py.test src/
      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=1000 django db rabbit redis minio
