name: PR 2588 independent validation

on:
  push:
    branches:
      - validation/pr2588-ci

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest requests
      - name: Compile modified Python files
        run: |
          python -m py_compile             compute_worker/submission_update.py             compute_worker/compute_worker.py             src/apps/api/tests/test_compute_worker_submission_update.py
      - name: Run focused regression
        run: pytest -q -c /dev/null src/apps/api/tests/test_compute_worker_submission_update.py

  production-compute-worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build production compute-worker image
        run: docker build -t pr2588-compute-worker -f packaging/container/Containerfile.compute_worker .
      - name: Verify packaged retry helper
        run: |
          docker run --rm --entrypoint python pr2588-compute-worker             -c "import submission_update; print(submission_update.__file__)"

  repository-native-core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Prepare Codabench CI environment
        run: |
          cp .env_circleci .env
          cp my-postgres_sample.conf my-postgres.conf
          mkdir -p var/minio/public var/minio/private
      - name: Start core Codabench services
        run: docker compose up -d db rabbit redis minio createbuckets django
      - name: Show service state
        run: docker compose ps
      - name: Run repository lint
        run: docker compose exec -T django flake8 src/
      - name: Run repository unit and integration tests
        run: docker compose exec -T -e CELERY_TASK_ALWAYS_EAGER=True django py.test src/
      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=1000 django db rabbit redis minio
