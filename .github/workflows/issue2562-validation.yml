name: Issue 2562 independent validation

on:
  push:
    branches:
      - validation/2562-ci

jobs:
  repository-native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Prepare Codabench CI environment
        run: |
          cp .env_circleci .env
          cp my-postgres_sample.conf my-postgres.conf
          mkdir -p var/minio/public var/minio/private
      - name: Start core Codabench services
        run: docker compose up -d db rabbit redis minio createbuckets django
      - name: Show service state
        run: docker compose ps
      - name: Run focused issue 2562 regressions
        run: |
          docker compose exec -T -e CELERY_TASK_ALWAYS_EAGER=True django py.test -q             src/apps/api/tests/test_submissions.py::SubmissionSoftDeletionTest::test_soft_delete_multitask_parent_cleans_children_and_shared_data             src/apps/api/tests/test_submissions.py::SubmissionSoftDeletionTest::test_submission_list_can_paginate_only_visible_parent_rows
      - name: Run repository lint
        run: docker compose exec -T django flake8 src/
      - name: Run repository unit and integration tests
        run: docker compose exec -T -e CELERY_TASK_ALWAYS_EAGER=True django py.test src/
      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=1200 django db rabbit redis minio

