name: Genesis G0 custody and selection correction
on:
  push:
    branches: [genesis/g0-custody-selection-20261001]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test runner
        run: python -m pip install -r .genesis/g0/requirements-test.txt
      - name: Integrity, execution, producer attribution, mutation and recovery
        run: python .genesis/g0/replay_gate.py > g0-external-replay.json
      - name: Record source identity and runtime
        if: always()
        run: |
          python --version
          sha256sum .genesis/g0/manifest.json
          cat g0-external-replay.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g0-custody-selection-replay
          path: g0-external-replay.json
