name: Issue 2578 G0 reality validation

on:
  push:
    branches:
      - validation/2578-g0

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Verify participant table wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("src/static/riot/competitions/detail/submission_manager.tag")
          s=p.read_text()
          assert "if (!opts.admin)" in s
          assert "filters.only_mine = true" in s
          print("FRONTEND_ONLY_MINE_WIRING_PASS")
          PY
      - name: Prepare Codabench test environment
        run: |
          cp .env_circleci .env
          cp my-postgres_sample.conf my-postgres.conf
          mkdir -p var/minio/public var/minio/private
      - name: Start core services
        run: docker compose up -d db rabbit redis minio createbuckets django
      - name: Run focused API regression
        run: |
          docker compose exec -T -e CELERY_TASK_ALWAYS_EAGER=True django             py.test -q src/apps/api/tests/test_submissions.py::SubmissionAPITests::test_only_mine_limits_organizer_list_and_pagination_count_to_self
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=700 django db rabbit redis minio

  repository-native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Prepare Codabench CI environment
        run: |
          cp .env_circleci .env
          cp my-postgres_sample.conf my-postgres.conf
          mkdir -p var/minio/public var/minio/private
      - name: Start core services
        run: docker compose up -d db rabbit redis minio createbuckets django
      - name: Run repository lint
        run: docker compose exec -T django flake8 src/
      - name: Run repository unit and integration tests
        run: docker compose exec -T -e CELERY_TASK_ALWAYS_EAGER=True django py.test src/
      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=1000 django db rabbit redis minio
